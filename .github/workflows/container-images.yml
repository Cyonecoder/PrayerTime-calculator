name: Container images

on:
  push:
    branches: [main, codex/part4-images]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Discover applications and Java toolchain
        id: detect
        run: |
          python3 scripts/containerize.py
          echo "java=$(python3 scripts/containerize.py --java-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.detect.outputs.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test detector
        run: python3 -m unittest discover -s scripts -p 'test_containerize.py'
      - name: Build every discovered application into one image context
        run: python3 scripts/containerize.py --build
      - uses: docker/setup-buildx-action@v3
      - name: Image names
        id: names
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags<<TAGS" >> "$GITHUB_OUTPUT"
          echo "$image:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "$image:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "TAGS" >> "$GITHUB_OUTPUT"
      - name: Authenticate publisher
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test image
        uses: docker/build-push-action@v6
        with:
          context: .container-build
          load: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=combined
          cache-to: type=gha,mode=max,scope=combined
      - name: Smoke test
        env:
          IMAGE: ${{ steps.names.outputs.image }}:${{ github.sha }}
        run: bash scripts/container-smoke.sh
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.names.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
            echo "Published: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TAGS"
