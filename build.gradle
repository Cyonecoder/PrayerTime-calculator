plugins {
    id 'java-library'
    id 'application'
}

group = 'io.github.cyonecoder'
version = '0.1.0'

java {
    toolchain {
        // Requirement: build/compile/run on a Java 21 toolchain.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    // Needed for the test dependencies (JUnit 5, AssertJ). No application
    // runtime/network dependencies are declared yet.
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

application {
    // Legacy entry point, kept runnable during the refactor. Standard Gradle
    // source layout (src/main/java, src/test/java) is now used.
    mainClass = 'io.github.cyonecoder.prayertime.legacy.LegacyMain'
}

tasks.named('test') {
    useJUnitPlatform()
}
