plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.cyonecoder'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // HTML parsing for the ported Habous timetable and ville-directory parsers.
    // Pinned to the version the source branch resolved, so the ported parsers
    // behave identically.
    implementation 'org.jsoup:jsoup:1.18.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Drives the ported HabousClient.Fetcher seam without touching the network.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// `java -jar build/libs/salat-api-service.jar` must work verbatim, so the name
// is pinned (Boot would otherwise append the version).
tasks.named('bootJar') {
    archiveFileName = 'salat-api-service.jar'
}

tasks.named('test') {
    useJUnitPlatform {
        // The normal suite never touches the network; live tests are opt-in only.
        excludeTags 'live'
    }
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// Opt-in task that runs ONLY the live/network tests (requires internet and a
// reachable Habous endpoint). Run with: ./gradlew liveTest
tasks.register('liveTest', Test) {
    description = 'Runs live network tests tagged "live" (requires internet).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
