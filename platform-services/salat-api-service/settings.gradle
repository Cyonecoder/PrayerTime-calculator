plugins {
    // Lets the Java toolchain auto-provision a JDK 21 when one is not installed
    // locally, so this build works on a machine whose default JDK is older.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This build is deliberately standalone: it is NOT included by the repository
// root build and does not depend on it. The folder can be copied out of the
// repository and built on its own.
rootProject.name = 'salat-api-service'
