<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habous Prayer Times — Comparison</title>
<style>
:root{
  --bg:#f6f8f6;--surface:#fff;--surface-2:#eef2ee;--line:#dde5e0;
  --ink:#16201c;--ink-soft:#4a5a53;--ink-faint:#7c8b84;
  --accent:#0f6b57;--accent-soft:#0f6b571a;--accent-ink:#0b4c3e;
  --good:#2f8f5b;--good-bg:#2f8f5b1f;--warn:#a9791a;--warn-bg:#a9791a1f;
  --bad:#bb4536;--bad-bg:#bb45361f;--sunrise:#a9791a12;
  --shadow:0 1px 2px #16201c0d,0 8px 24px #16201c0a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1411;--surface:#151d19;--surface-2:#1b241f;--line:#2a352f;
  --ink:#e9efea;--ink-soft:#a9b7b0;--ink-faint:#7b8a83;
  --accent:#54c3a4;--accent-soft:#54c3a41f;--accent-ink:#7fd6bd;
  --good:#57c188;--good-bg:#57c1881f;--warn:#d6a53f;--warn-bg:#d6a53f1f;
  --bad:#e0705f;--bad-bg:#e0705f1f;--sunrise:#d6a53f14;
  --shadow:0 1px 2px #0006,0 10px 30px #0004;}}
:root[data-theme="light"]{
  --bg:#f6f8f6;--surface:#fff;--surface-2:#eef2ee;--line:#dde5e0;
  --ink:#16201c;--ink-soft:#4a5a53;--ink-faint:#7c8b84;
  --accent:#0f6b57;--accent-soft:#0f6b571a;--accent-ink:#0b4c3e;
  --good:#2f8f5b;--good-bg:#2f8f5b1f;--warn:#a9791a;--warn-bg:#a9791a1f;
  --bad:#bb4536;--bad-bg:#bb45361f;--sunrise:#a9791a12;
  --shadow:0 1px 2px #16201c0d,0 8px 24px #16201c0a;}
:root[data-theme="dark"]{
  --bg:#0e1411;--surface:#151d19;--surface-2:#1b241f;--line:#2a352f;
  --ink:#e9efea;--ink-soft:#a9b7b0;--ink-faint:#7b8a83;
  --accent:#54c3a4;--accent-soft:#54c3a41f;--accent-ink:#7fd6bd;
  --good:#57c188;--good-bg:#57c1881f;--warn:#d6a53f;--warn-bg:#d6a53f1f;
  --bad:#e0705f;--bad-bg:#e0705f1f;--sunrise:#d6a53f14;
  --shadow:0 1px 2px #0006,0 10px 30px #0004;}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-size:15px;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:clamp(20px,4vw,52px)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2{text-wrap:balance;margin:0}
header.mast{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:650;margin-bottom:12px}
h1{font-size:clamp(25px,4.2vw,38px);font-weight:700;letter-spacing:-.02em;line-height:1.08}
.lede{margin-top:14px;color:var(--ink-soft);max-width:66ch;font-size:15.5px}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:20px;font-size:13px;color:var(--ink-faint);align-items:center}
.meta b{color:var(--ink-soft);font-weight:600}
.livebadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--good);
  background:var(--good-bg);padding:4px 11px;border-radius:999px}
.livebadge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
section{margin-top:38px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sec-head h2{font-size:19px;font-weight:660;letter-spacing:-.01em}
.sec-head .num{font-size:12px;color:var(--ink-faint);letter-spacing:.1em;font-weight:600}
.sec-head .sub{margin-left:auto;font-size:12.5px;color:var(--ink-faint)}
.ids{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}
.idcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px}
.idcard .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.idcard .city{font-size:16px;font-weight:660}.idcard .ar{font-size:17px;color:var(--ink-soft)}
.idcard .ville{font-size:13px;color:var(--ink-faint)}.idcard .ville b{color:var(--accent-ink);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:13px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--ink-faint)}.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:3px}.tile .u{font-size:12px;color:var(--ink-faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:18px}
.cap{display:flex;align-items:center;gap:10px;padding:12px 17px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.cap .city{font-weight:660;font-size:15px}.cap .ar{color:var(--ink-soft)}
.cap .st{margin-left:auto;font-size:12px;color:var(--ink-faint)}.cap .st b{color:var(--ink-soft)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 13px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;position:sticky;top:0;background:var(--surface)}
tbody tr+tr td{border-top:1px solid var(--line)}
tbody tr:hover td{background:var(--surface-2)}
td.time,.t{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-faint)}
th.sunrise,td.sunrise{background:var(--sunrise)}
tr.rowbad td{color:var(--bad)}
.chip{display:inline-block;min-width:30px;text-align:center;font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11px;font-weight:650;padding:1px 6px;border-radius:5px;margin-left:6px}
.chip.g{background:var(--good-bg);color:var(--good)}.chip.w{background:var(--warn-bg);color:var(--warn)}.chip.b{background:var(--bad-bg);color:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-faint);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.callout{margin-top:16px;padding:13px 16px;background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink-soft)}
.callout b{color:var(--warn)}
.banner{padding:13px 16px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink-soft)}
.banner b{color:var(--accent-ink)}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-faint);line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="eyebrow">Morocco &middot; Habous method</div>

    <div id="citytables"></div>
  </section>

  <footer id="foot"></footer>
</div>

    +`<div class="card"><div class="cap"><span class="city">By prayer</span></div><div class="scroll"><table>${pp}</tbody></table></div></div>`
    +callout
    +`<div class="card" style="margin-top:18px"><div class="cap"><span class="city">By city</span></div><div class="scroll"><table>${cc}</tbody></table></div></div>`;
  document.getElementById("legend").innerHTML=
    `<span><span class="dot" style="background:var(--good)"></span>exact</span>`
    +`<span><span class="dot" style="background:var(--warn)"></span>±1 min</span>`
    +`<span><span class="dot" style="background:var(--bad)"></span>≥2 min</span>`;
  document.getElementById("detitle").textContent="Day by day · official time with Δ";
}

// detail tables
document.getElementById("citytables").innerHTML=D.cities.map(c=>{
  const off=D.official[c]||{}, cal=D.calc[c]||{};
  const rows=D.dates.filter(dt=>cal[dt]).map(dt=>{
    return `<tr><td class="time">${md(dt)}</td>`+P.map(p=>{
      const cv=cal[dt][p];
      if(off[dt]){
        const ov=off[dt][p];
        const diff=(parseInt(cv.slice(0,2))*60+parseInt(cv.slice(3)))-(parseInt(ov.slice(0,2))*60+parseInt(ov.slice(3)));
        return `<td class="time${p==='sunrise'?' sunrise':''}"><span class="t">${ov}</span><span class="chip ${cls(diff)}">${sg(diff)}</span></td>`;
      }
      return `<td class="time${p==='sunrise'?' sunrise':''}"><span class="t muted">${cv}</span></td>`;
    }).join("")+`</tr>`;
  }).join("");
  const s=D.perCity[c];
  const st = (s&&s.n) ? `exact <b>${pct(s.exact,s.n)}</b> · MAE <b>${s.mae}</b> min` : `calculated only`;
  return `<div class="card"><div class="cap"><span class="city">${D.display[c]}</span>
    <span class="ar" dir="rtl">${D.arabic[c]||""}</span><span class="st">${st}</span></div>
    <div class="scroll"><table>
    <thead><tr><th>Date</th>${P.map(p=>`<th${p==='sunrise'?' class="sunrise"':''}>${L[p]}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}).join("");

document.getElementById("foot").innerHTML=`Generated ${D.generatedAt} by <span class="mono">scripts/habous_report.py</span>.
  Calculated times from the production engine (<span class="mono">range</span> CLI);
  official times, where shown, fetched live from <span class="mono">habous.gov.ma/prieres/index.php?ville=&lt;id&gt;</span>.
  No production calculation parameters were changed.`;
</script>
</body>
</html>
